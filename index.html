<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lotus Demo Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --accent:#2F7A78; --ink:#205B59; --soft:#E1EFED;
  --gold:#D9A441; --goldSoft:#F6ECD3; --goldInk:#6E4E0F;
  --ground:#F5F7F7; --surface:#FFFFFF; --text:#1E2A30; --muted:#55616A; --line:#E0E6E8;
  --warnBg:#FFF0D9; --warn:#8A4B00; --grayBg:#EEF1F4; --gray:#3D4852;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,'Noto Sans Khmer',system-ui,sans-serif;background:var(--ground);color:var(--text);font-size:15px;line-height:1.45}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grow{flex:1 1 20px}
small{font-size:12px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.brand-text{display:flex;flex-direction:column;line-height:1.25}
.brand-text small,.who small{color:var(--muted)}
.demo-badge{font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 8px;border-radius:6px;background:var(--goldSoft);color:var(--goldInk)}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;height:42px;min-width:260px;border:1px solid var(--line);border-radius:10px;background:var(--ground);color:var(--muted)}
.search input{border:0;background:transparent;outline:none;width:100%;color:var(--text)}
.search:focus-within{border-color:var(--ink)}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.who>span:last-child{display:flex;flex-direction:column;line-height:1.3}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}

/* Shell */
.shell{display:flex;min-height:calc(100vh - 66px)}
.side{width:232px;flex:none;padding:18px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.side a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--muted);font-size:14px}
.side a small{font-size:13px}
.side a:hover{background:var(--ground)}
.side a.on{background:var(--soft);color:var(--ink);font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--ground);font-size:12px;color:var(--muted)}
.side-foot p{margin:0}
main{flex:1;min-width:0;padding:26px 28px 40px;display:flex;flex-direction:column;gap:20px;outline:none}

/* Common */
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-size:16px;font-weight:600}
.sub{margin:4px 0 0;color:var(--muted)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.head>div:first-child{flex:1 1 300px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h2{flex:1}
.cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.c2{flex:2 1 480px;min-width:0;display:flex;flex-direction:column;gap:18px}
.c1{flex:1 1 290px;min-width:0;display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#174645}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill svg{width:14px;height:14px;stroke-width:2.5}
.p-ok{background:var(--goldSoft);color:var(--goldInk)}
.p-cf{background:var(--soft);color:var(--ink)}
.p-wait{background:var(--grayBg);color:var(--gray)}
.p-warn{background:var(--warnBg);color:var(--warn)}
.bar{height:6px;border-radius:3px;background:var(--line)}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--gold)}
.bar.thick{height:9px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:var(--r);padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:30px;font-weight:700;line-height:1.15}
.kpi span{font-size:13px;color:var(--muted)}
.kpi small{color:var(--muted)}
.kpi.t2{border-top-color:var(--gold)} .kpi.t3{border-top-color:var(--ink)} .kpi.t4{border-top-color:#D9922E}
.up{color:#3F6B2E!important}

/* Schedule */
.sched-row{display:grid;grid-template-columns:62px minmax(150px,2fr) minmax(110px,1.3fr) minmax(110px,1.2fr) 150px 128px;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.sched-row:last-child{border-bottom:0}
.sched-row .who-cell{display:flex;flex-direction:column;min-width:0}
.sched-row .who-cell b:hover{text-decoration:underline}
.sched-act{justify-self:end}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list-item:first-of-type{border-top:0}
.list-item>div{flex:1;display:flex;flex-direction:column;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.alert{display:flex;gap:10px;font-size:14px}

/* Clients */
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 20px;border-bottom:1px solid var(--line)}
.table td{padding:12px 20px;border-bottom:1px solid var(--line)}
.table tr:last-child td{border-bottom:0}
.table tbody tr{cursor:pointer}
.table tbody tr:hover td{background:var(--ground)}
.scroll{overflow-x:auto}

/* Profile */
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.hero .avatar{width:64px;height:64px;font-size:22px}
.hero-main{flex:1 1 280px;display:flex;flex-direction:column;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pkg{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.pkg-top{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.pkg-top b{flex:1}
.big{font-size:36px;font-weight:700;color:var(--ink)}
.ledger{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.ledger span:nth-child(2){flex:1}
.visit{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}

/* Sell */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.opt{text-align:left;min-height:66px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.opt b{display:block;font-size:15px}
.opt small{display:block;margin-top:3px;color:var(--muted)}
.opt.on{border:2px solid var(--ink);background:var(--soft);color:var(--ink);padding:11px 13px}
.opt.on small{color:var(--ink)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field select,.field input{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--text)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.line-item{display:grid;grid-template-columns:minmax(0,1fr) 110px 90px 36px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.qty{display:flex;align-items:center;gap:6px}
.qty button,.x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.switch{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ground);cursor:pointer;text-align:left;width:100%}
.switch .trk{width:42px;height:24px;border-radius:12px;background:#B8C0C6;position:relative;flex:none;transition:background .15s}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-pressed="true"] .trk{background:var(--ink)}
.switch[aria-pressed="true"] .trk::after{left:21px}
.switch[disabled]{opacity:.5;cursor:not-allowed}
.sum-line{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.sum-line span:first-child{flex:1;color:var(--muted)}
.sum-line span:last-child{font-weight:600;text-align:right}
.total{display:flex;align-items:baseline;gap:10px;padding-top:4px}
.total span:first-child{flex:1;font-weight:600}
.total b{font-size:28px;color:var(--ink)}
.credit-box{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--goldSoft);color:var(--goldInk);font-size:14px}
.credit-box span:first-child{flex:1}
.warnbox{padding:10px 12px;border-radius:10px;background:var(--warnBg);color:var(--warn);font-size:13px}
.sticky{position:sticky;top:86px}

/* Dashboard */
.seg{display:flex;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.seg button{min-height:38px;padding:0 16px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.chart{display:flex;align-items:flex-end;gap:14px;height:210px;padding-top:10px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;font-weight:600}
.chart .col i{display:block;width:100%;max-width:48px;border-radius:6px 6px 0 0;background:var(--gold)}
.chart .col.now i{background:var(--accent)}
.chart-x{display:flex;gap:14px}
.chart-x span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.mix{display:flex;flex-direction:column;gap:6px}
.mix .row span:first-child{flex:1}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.li{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.li small{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}

/* Toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:20;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Phone / counter */
@media (max-width:760px){
  body{font-size:15px;padding-bottom:76px}
  .top{padding:10px 16px;gap:10px}
  .brand-text small,.who{display:none}
  .demo-badge{font-size:10px}
  .search{order:5;flex:1 1 100%;min-width:0}
  .shell{display:block;min-height:0}
  .side{position:fixed;left:0;right:0;bottom:0;width:auto;flex-direction:row;padding:6px max(6px, env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(6px, env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:10;gap:0}
  .side a{flex:1;flex-direction:column;gap:3px;min-height:52px;padding:4px 2px;font-size:11px;justify-content:center;text-align:center}
  .side a small,.side-foot{display:none}
  .side svg{width:20px;height:20px}
  main{padding:16px 16px 24px;gap:14px}
  h1{font-size:23px}
  .sched-row{grid-template-columns:52px minmax(0,1fr) auto;grid-template-areas:"t w s" "t tr a";padding:12px 14px;row-gap:6px}
  .sched-row>.t{grid-area:t}.sched-row>.who-cell{grid-area:w}.sched-row>.tr{grid-area:tr}.sched-row>.pg{display:none}.sched-row>.st{grid-area:s;justify-self:end}.sched-row>.sched-act{grid-area:a}
  .kpi b{font-size:24px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .sticky{position:static}
  .table .hide-m{display:none}
  .table td,.table th{padding:10px 14px}
}
[hidden]{display:none!important}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
</style>
</head>
<body>


<header class="top">
  <a class="brand" href="#today">
    <span class="mark">LD</span>
    <span class="brand-text"><b>Lotus Demo Clinic</b><small>គ្លីនិកសាកល្បង Lotus</small></span>
  </a>
  <span class="demo-badge">DEMO · SAMPLE DATA</span>
  <span class="grow"></span>
  <form class="search" id="topSearch" role="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <label class="sr" for="q">Search client</label>
    <input id="q" type="search" placeholder="Name, phone or file ID · ស្វែងរក" autocomplete="off">
  </form>
  <div class="who"><span class="avatar">FD</span><span><b>Front Desk</b><small id="todayLabel"></small></span></div>
</header>
<div class="shell">
  <nav class="side" aria-label="Main">
    <a href="#today" data-nav="today"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Today<small> · ថ្ងៃនេះ</small></span></a>
    <a href="#clients" data-nav="clients"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 100-6M22 21c0-3-2-5-5-5.5"/></svg><span>Clients<small> · អតិថិជន</small></span></a>
    <a href="#sell" data-nav="sell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h2l2.5 11h10L21 7H7"/><circle cx="10" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg><span>Sell / Record<small> · លក់</small></span></a>
    <a href="#dashboard" data-nav="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Dashboard<small> · ផ្ទាំងគ្រប់គ្រង</small></span></a>
    <div class="side-foot">
      <p>Nana assistant is online. Booking alerts arrive in about 2 minutes.</p>
      <button type="button" class="btn ghost small" id="resetBtn">Reset demo data</button>
    </div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* Lotus Demo Clinic — sample-data demo app. All data lives in this browser only. */
(function () {
  'use strict';

  var KEY = 'lotus-demo-v1';
  var DAY = 864e5;
  var TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);

  var PRODUCTS = [
    { id: 'p1', name: 'Vitamin C Serum 30ml', price: 45 },
    { id: 'p2', name: 'Sunscreen SPF 50', price: 31 },
    { id: 'p3', name: 'Hydrating Toner', price: 28 },
    { id: 'p4', name: 'Night Repair Cream', price: 52 },
    { id: 'p5', name: 'Gentle Cleanser', price: 22 }
  ];
  var PACKAGES = [
    { id: 'k1', name: 'HydraFacial', sessions: 10, price: 650 },
    { id: 'k2', name: 'Laser Toning', sessions: 5, price: 400 },
    { id: 'k3', name: 'Acne Clear', sessions: 10, price: 550 },
    { id: 'k4', name: 'Whitening Drip', sessions: 6, price: 480 }
  ];
  var TOPUPS = [
    { id: 'none', title: 'No top-up', sub: 'Skip', paid: 0, credit: 0 },
    { id: '300', title: '$300 → $330', sub: '+$30 bonus (10%)', paid: 300, credit: 330 },
    { id: '500', title: '$500 → $575', sub: '+$75 bonus (15%)', paid: 500, credit: 575 }
  ];
  var STAFF = ['Therapist A', 'Therapist B', 'Specialist 1', 'Front Desk'];
  var METHODS = ['ABA transfer', 'Cash', 'Card'];

  /* ---------- helpers ---------- */
  function iso(d) { var m = d.getMonth() + 1, x = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (x < 10 ? '0' : '') + x; }
  function ago(n) { return iso(new Date(TODAY.getTime() - n * DAY)); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  function dShort(s) { var d = parse(s); return (d.getDate() < 10 ? '0' : '') + d.getDate() + ' ' + MON[d.getMonth()]; }
  function dLong(s) { var d = parse(s); return dShort(s) + ' ' + d.getFullYear(); }
  function money(n) { var neg = n < 0; n = Math.abs(n); var s = n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (neg ? '−' : '') + '$' + s; }
  function money0(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
  function r2(n) { return Math.round(n * 100) / 100; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function initials(n) { return n.split(' ').map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase(); }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  var ICON = {
    ok: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
    wait: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    warn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>'
  };

  /* ---------- seed ---------- */
  function seed() {
    var id = 0;
    function pk(name, total, used, boughtAgo, note) {
      return { id: 'pk' + (++id), name: name, total: total, used: used, bought: ago(boughtAgo), status: used >= total ? 'Completed' : 'Active', note: note || '' };
    }
    function L(daysAgo, type, amount, note) { return { date: ago(daysAgo), type: type, amount: amount, note: note }; }
    function V(daysAgo, what, note, by) { return { date: ago(daysAgo), what: what, note: note, by: by }; }
    var clients = [
      { id: 'c1', name: 'Sok Dalin', phone: '012 345 412', file: 'F-0412', member: 'Glow', tg: true, consent: true, since: ago(220),

    S.clients.forEach(function (c) { var a = activePkgs(c); a.forEach(function (p) { owedSess += p.total - p.used; }); owedCredit += balance(c); if (a.length) { withPkg++; if (bookedIds[c.id] || c.next) booked++; } });
    var rebook = withPkg ? Math.round(booked / withPkg * 100) : 0;
    var label = isThis ? MON[m] + ' ' + y + ' (to date)' : MON[(m + 11) % 12] + ' ' + (m === 0 ? y - 1 : y);
    var h = '<div class="head"><div><h1>Owner dashboard</h1><p class="sub">ផ្ទាំងគ្រប់គ្រងម្ចាស់ · ' + label + '</p></div><div class="seg" role="group" aria-label="Period"><button type="button" data-act="period" data-id="this" class="' + (isThis ? 'on' : '') + '">This month</button><button type="button" data-act="period" data-id="last" class="' + (isThis ? '' : 'on') + '">Last month</button></div></div>';
    h += '<div class="kpis">' + kpi(isThis ? 'Sales this month' : 'Sales last month', money0(total), (pct >= 0 ? '+' : '') + pct + '% vs ' + (isThis ? 'same days last month' : 'month before'), '', pct >= 0 ? 'up' : '') +
      kpi('Prepaid sessions owed', owedSess, 'Sessions clients still have', 't2') + kpi('Homecare credit owed', money0(owedCredit), 'Balance clients can still spend', 't3') +
      kpi('Rebooked', rebook + '%', 'Package clients with a next booking', 't2') + '</div>';
    // weekly
    var weeks = [];
    for (var w = 5; w >= 0; w--) { var e = new Date(TODAY.getTime() - w * 7 * DAY), s = new Date(e.getTime() - 6 * DAY); weeks.push({ s: iso(s), e: iso(e), v: sum(iso(s), iso(e)) }); }
    var max = Math.max.apply(null, weeks.map(function (x) { return x.v; })) || 1;
    h += '<div class="cols"><section class="card stack c2" style="gap:12px"><h2>Sales by week · ការលក់ប្រចាំសប្ដាហ៍</h2><div class="chart" role="img" aria-label="' + esc(weeks.map(function (x) { return 'Week to ' + dShort(x.e) + ': ' + money0(x.v); }).join(', ')) + '">';
    weeks.forEach(function (x, i) { h += '<div class="col' + (i === 5 ? ' now' : '') + '"><span class="num">' + money0(x.v) + '</span><i style="height:' + Math.max(4, Math.round(x.v / max * 160)) + 'px"></i></div>'; });
    h += '</div><div class="chart-x">' + weeks.map(function (x, i) { return '<span>' + (i === 5 ? 'Last 7 days' : 'to ' + dShort(x.e)) + '</span>'; }).join('') + '</div></section>';
    var mix = [['Treatment packages', sum(from, to, 'package'), 'var(--accent)'], ['Homecare products', sum(from, to, 'product'), 'var(--gold)'], ['Credit top-ups', sum(from, to, 'credit'), 'var(--ink)']];
    var mmax = Math.max(mix[0][1], mix[1][1], mix[2][1]) || 1;
    h += '<section class="card stack c1" style="gap:14px"><h2>Where sales come from</h2>';
    mix.forEach(function (x) { h += '<div class="mix"><div class="row"><span>' + x[0] + '</span><b class="num">' + money0(x[1]) + '</b></div><div class="bar thick"><i style="width:' + Math.round(x[1] / mmax * 100) + '%;background:' + x[2] + '"></i></div></div>'; });
    h += '<small class="muted">Products paid with homecare credit are not counted again here. The cash came in at top-up.</small></section></div>';
    // lists
    var fol = [];
    S.appts.forEach(function (a) { if (a.status === 'pending') fol.push([client(a.cid).name, 'Not reconfirmed for today ' + a.time]); });
    S.tomorrow.forEach(function (a) { if (a.status === 'pending') fol.push([client(a.cid).name, 'Reconfirm for tomorrow ' + a.time]); });
    S.clients.forEach(function (c) { if (!c.pkgs.length && c.visits.length && c.visits[0].what === 'Free skin scan') fol.push([c.name, 'Scan on ' + dShort(c.visits[0].date) + ', said Not now']); });
    var seen = {}; fol = fol.filter(function (x) { if (seen[x[0]]) return false; seen[x[0]] = 1; return true; });
    var end = [];
    S.clients.forEach(function (c) { c.pkgs.forEach(function (p) { if (p.status === 'Active' && p.total - p.used <= 1) end.push([c.name, p.name + ' · ' + (p.total - p.used) + ' left. Offer a renewal']); else if (p.status === 'Completed' && p.bought > ago(200) && !activePkgs(c).length) end.push([c.name, p.name + ' finished. No new package yet']); }); });
    var chk = S.subs.filter(function (s) { return s.date === tdy; }).map(function (s) { return [client(s.cid).name, s.text]; });
    h += '<div class="lists">' + listCard('Follow-ups due', fol, 'background:var(--goldSoft);color:var(--goldInk)') + listCard('Packages ending', end, 'background:var(--soft);color:var(--ink)') + listCard('Needs admin check today', chk, 'background:var(--warnBg);color:var(--warn)') + '</div>';
    h += '<p class="muted" style="margin:0;font-size:12px">Sample data. In the real system these numbers come straight from the clinic\'s records.</p>';
    main.innerHTML = h;
  }
  function listCard(title, arr, badge) {
    var h = '<section class="card"><div class="row" style="margin-bottom:6px"><h2 style="flex:1;font-size:15px">' + title + '</h2><span class="pill" style="' + badge + '">' + arr.length + '</span></div>';
    arr.slice(0, 5).forEach(function (x) { h += '<div class="li"><b>' + esc(x[0]) + '</b><small>' + esc(x[1]) + '</small></div>'; });
    if (!arr.length) h += '<p class="empty">Nothing waiting.</p>';
    return h + '</section>';
  }

  /* ---------- router (in-page; the artifact frame keeps the URL fixed) ---------- */
  var cur = /^#(today|clients|sell|dashboard)$/.test(location.hash) ? location.hash : '#today';
  function go(h) { cur = h; route(); }
  function route() {
    var hsh = (cur || '#today').slice(1), parts = hsh.split('/'), q = '';
    var qi = parts[0].indexOf('?'); if (qi >= 0) { q = decodeURIComponent(parts[0].slice(qi + 3)); parts[0] = parts[0].slice(0, qi); }
    if (parts[0] !== 'sell') cart = null;
    if (parts[0] !== 'book') bk = null;
    switch (parts[0]) {
      case 'clients': viewClients(q); break;
      case 'client': viewProfile(parts[1]); break;
      case 'sell': viewSell(parts[1], parts[2]); break;
      case 'dashboard': viewDashboard(); break;
      case 'book': viewBook(parts[1]); break;
      default: viewToday();
    }
    if ((parts[0] !== 'sell' && parts[0] !== 'book') || !parts[1]) window.scrollTo(0, 0);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (ev) {
    var lk = ev.target.closest('a[href^="#"]');
    if (lk) { ev.preventDefault(); go(lk.getAttribute('href')); return; }
    var tr = ev.target.closest('tr[data-href]');
    if (tr && !ev.target.closest('a')) { go(tr.getAttribute('data-href')); return; }
    var el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    function findA(list) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; }
    switch (act) {
      case 'confirm': findA(S.appts).status = 'confirmed'; save(); viewToday(); toast('Confirmed · បានបញ្ជាក់'); break;
      case 'checkin': findA(S.appts).status = 'arrived'; save(); viewToday(); toast('Checked in. Nana tells the therapist.'); break;
      case 'tconfirm': findA(S.tomorrow).status = 'confirmed'; save(); viewToday(); toast('Tomorrow confirmed. File goes on the Specialist\'s desk.'); break;
      case 'newbook': case 'book': toast('Booking screen comes in the full version.'); break;
      case 'nana': toast('Nana sends a Khmer message to ' + client(id).name + ' on Telegram (demo).'); break;
      case 'reset': doReset(); break;
      case 'usepkg': cart.pkgUse = id || null; renderSell(); break;
      case 'newpkg': cart.newPkg = id || null; renderSell(); break;
      case 'topup': cart.topup = id; renderSell(); break;
      case 'paycredit': cart.payCredit = !cart.payCredit; renderSell(); break;
      case 'addp': var pid = document.getElementById('addp').value, ex = cart.items.filter(function (x) { return x.pid === pid; })[0]; if (ex) ex.qty++; else cart.items.push({ pid: pid, qty: 1 }); renderSell(); break;
      case 'qty': var it = cart.items[+el.getAttribute('data-i')]; it.qty = Math.max(1, it.qty + (+el.getAttribute('data-d'))); renderSell(); break;
      case 'rm': cart.items.splice(+el.getAttribute('data-i'), 1); if (!cart.items.length) cart.payCredit = false; renderSell(); break;
      case 'submit': submit(); break;
      case 'bktreat': bk.treat = id; renderBook(); break;
      case 'bkday': bk.date = id; bk.time = null; renderBook(); break;
      case 'bktime': bk.time = id; renderBook(); break;
      case 'bkremind': bk.remind = !bk.remind; renderBook(); break;
      case 'bksave': saveBooking(); break;
      case 'addclient': addClient(); break;
      case 'period': period = id; viewDashboard(); break;
    }
  });
  document.addEventListener('change', function (ev) {
    var f = ev.target.getAttribute && ev.target.getAttribute('data-f');
    if (f && cart) { cart[f] = ev.target.value; if (f === 'method') return; }
    if (ev.target.getAttribute && ev.target.getAttribute('data-bf') && bk) { bk.by = ev.target.value; renderBook(); }
  });
  document.addEventListener('input', function (ev) {
    var f = ev.target.getAttribute && ev.target.getAttribute('data-f');
    if (f === 'receipt' && cart) cart.receipt = ev.target.value;
  });
  document.getElementById('topSearch').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = document.getElementById('q').value.trim();
    var hits = S.clients.filter(function (c) { return match(c, v); });
    go(hits.length === 1 ? '#client/' + hits[0].id : '#clients?q=' + encodeURIComponent(v));
  });
  document.getElementById('resetBtn').addEventListener('click', doReset);
  function doReset() { S = seed(); save(); cart = null; period = 'this'; toast('Demo data reset.'); go('#today'); }

  document.getElementById('todayLabel').textContent = DOW[TODAY.getDay()].slice(0, 3) + ' ' + dLong(iso(TODAY));
  load();
  route();
})();
</script>
</body>
</html>
